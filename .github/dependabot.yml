# Dependabot (decisión 51): un pull request semanal con todas las actualizaciones de npm juntas.
# Las alertas de seguridad no se activan desde este archivo: Settings → Advanced Security → Dependabot alerts.
# Cada pull request de Dependabot se comprueba con `npm test && npm run build` en Claude Code antes de fusionarlo
# (decisión 52).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      npm:
        patterns:
          - '*'
      # Si se activan las actualizaciones de seguridad en GitHub, también llegan juntas en un pull request.
      npm-seguridad:
        applies-to: security-updates
        patterns:
          - '*'
    # Versiones mayores que no se proponen (decisión 110).
    ignore:
      # TypeScript 7.0 no trae la API programática del compilador que necesita typescript-eslint
      # (prevista en 7.1). Revisar cuando salga 7.1 y typescript-eslint la soporte.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # La app usa Node 24 (`engines` de package.json, decisión 6): los tipos van con 24.x.
      # Cambia solo si se cambia la versión de Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'Dependencias'
